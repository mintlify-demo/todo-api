[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-client"
version = "0.1.0"
description = "Python client for the mintlify-demo Todo API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.setuptools]
packages = ["todo_client"]
